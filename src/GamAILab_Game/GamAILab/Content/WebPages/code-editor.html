<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body, #editor { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    </style>

    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="editor"></div>
    <script>
        let editor;

        require.config({ paths: { 'vs': 'https://cloudflare.com' } });
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
              value: "",
                language: 'javascript',
                theme: 'vs-dark',
                automaticLayout: true
            });
        });

        window.setUnrealCode = function(rawText) {
            if (editor) {
                editor.setValue(rawText);
            }
        };

        window.getUnrealCode = function() {
            if (editor) {
                return editor.getValue();
            }
            return "";
        };
    </script>
</body>
</html>
